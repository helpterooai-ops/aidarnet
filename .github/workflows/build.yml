name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Keystore
        run: |
          if [ -f android/app/release-keystore.jks ]; then
            echo "Keystore found in repository"
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            B64=$(echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -cd 'A-Za-z0-9+/=')
            MOD=$(( ${#B64} % 4 ))
            if [ "$MOD" -eq 2 ]; then B64="${B64}=="; fi
            if [ "$MOD" -eq 3 ]; then B64="${B64}="; fi
            echo "$B64" | base64 -d > android/app/release-keystore.jks
            echo "Keystore decoded from secret (self-healed)"
          else
            echo "No keystore - debug signing will be used"
          fi

      - name: Verify Keystore
        run: |
          if [ -f android/app/release-keystore.jks ]; then
            keytool -list -keystore android/app/release-keystore.jks -storepass aldar2024 -alias aldar
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/**/app-release.apk
