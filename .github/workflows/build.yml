name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-run: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Decode Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 -d -i > android/app/release-keystore.jks
            echo "Keystore decoded"
            ls -la android/app/release-keystore.jks
          else
            echo "No keystore secret - will use debug signing"
          fi

      - name: Verify Keystore
        run: |
          if [ -f android/app/release-keystore.jks ]; then
            keytool -list -keystore android/app/release-keystore.jks -storepass aldar2024 -alias aldar
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/**/app-release.apk
